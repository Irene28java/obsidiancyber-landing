[build]
  command = "rm -rf dist && mkdir -p dist/assets && cp index.html styles.css script.js sample-report.html terms.html privacy.html dist/ && cp assets/obsidiancyber-eye.png dist/assets/"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://obsidiancyber-landing.onrender.com/api/:splat"
  status = 200
  force = true
